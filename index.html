<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryGram</title><style>
:root{--bg:#f7f2fa;--card:#fff;--text:#1d1b20;--muted:#625b71;--accent:#6750a4;--line:#e7e0ec}
@media (prefers-color-scheme:dark){:root{--bg:#141218;--card:#211f26;--text:#e6e0e9;--muted:#cac4d0;--accent:#d0bcff;--line:#36343b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header{margin-bottom:24px}.brand{font-weight:800;color:var(--accent);letter-spacing:-.5px;text-decoration:none}
h1{font-size:1.9rem;line-height:1.2;margin:.3em 0}h2{font-size:1.2rem;margin:1.8em 0 .4em}
.meta{color:var(--muted);font-size:.95rem}a{color:var(--accent)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 20px 16px;margin:16px 0}
ul{padding-left:1.2em}li{margin:.25em 0}nav.footer{margin-top:40px;color:var(--muted);font-size:.9rem}
nav.footer a{margin-right:14px}
</style></head>
<body><main><header><a class="brand" href="./">StoryGram</a></header>
<h1>StoryGram</h1>
<p>Read and publish stories — love, life, success and more, in Hindi and English.</p>
<section class="card"><h2>Information</h2><ul>
<li><a href="privacy">Privacy policy</a></li>
<li><a href="terms">Terms of service</a></li>
<li><a href="delete-account">Delete your account</a></li>
<li><a href="help">Help &amp; support</a></li></ul></section>
<nav class="footer"><a href="privacy">Privacy policy</a><a href="terms">Terms</a><a href="delete-account">Delete account</a><a href="help">Help</a></nav>
</main></body></html>
