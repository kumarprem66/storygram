# ============================================================
# StoryVerse Backend - Local Development Configuration
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/storyverse
    username: storyverse
    password: storyverse
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    clean-disabled: false

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  # Disable security for local dev (override in modules as needed)
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

logging:
  level:
    com.storyverse: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
