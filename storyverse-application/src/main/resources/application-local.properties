# ============================================================
# StoryVerse Backend - Local Development Configuration
# ============================================================

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/storyverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.clean-disabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# Server
server.port=8084

# Logging
logging.level.com.storyverse=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
